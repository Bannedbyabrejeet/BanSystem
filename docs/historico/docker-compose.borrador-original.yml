# ============================================================================
#  BORRADOR HISTÓRICO — NO ES EL COMPOSE REAL DEL PROYECTO
# ============================================================================
#
#  Este archivo es el borrador original de la Issue #4, cuando se preveía
#  dockerizar TODA la arquitectura: proxy Nginx, Servicio 1 (FastAPI) y
#  Servicio 2 (Flask), este último con NET_ADMIN para operar UFW.
#
#  Ese diseño se descartó. La decisión vigente es dockerizar ÚNICAMENTE
#  Redis (ver ../../docker-compose.yml), porque Redis necesita un servidor
#  real con persistencia en disco (AOF + RDB); el resto de los servicios
#  corre en la máquina y alcanza a Redis por loopback en 127.0.0.1:6379.
#
#  Se conserva solo como registro histórico del diseño descartado.
#  Arquitectura real: ../DOCKER_REDIS.md §6.
# ============================================================================

version: '3.8'

services:
  # =========================================================================
  # 1. Reverse Proxy & API Gateway (Nginx)
  # =========================================================================
  proxy:
    image: nginx:alpine
    container_name: bannedbyabrejeet_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - service1-api
      - service2-engine
    networks:
      - internal_net

  # =========================================================================
  # 2. Servicio 1: API REST & Administración (FastAPI)
  # =========================================================================
  service1-api:
    build:
      context: ./backend-service1
      dockerfile: Dockerfile
    container_name: bannedbyabrejeet_service1
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
    networks:
      - internal_net

  # =========================================================================
  # 3. Base de Datos en Memoria & Message Broker (Redis)
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: bannedbyabrejeet_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-""}
    volumes:
      - redis_data:/data
    networks:
      - internal_net

  # =========================================================================
  # 4. Servicio 2: Motor de Seguridad & UFW Daemon (Flask)
  #    -> SOLUCIÓN AL ISSUE: Permisos de kernel y lectura de logs del Host
  # =========================================================================
  service2-engine:
    build:
      context: ./backend-service2
      dockerfile: Dockerfile
    container_name: bannedbyabrejeet_service2
    restart: unless-stopped
    # Permite inyectar reglas de filtrado de paquetes en el firewall del Host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Comparte la pila de red del Host para aplicar bloqueos al puerto 22 real
    network_mode: "host"
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - LOG_FILE_PATH=/var/log/auth.log
    volumes:
      # Lectura de logs SSH del Host en modo Solo Lectura (Evita manipulación)
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log:/var/log/host_logs:ro
      # Módulos y configuración de UFW
      - /lib/modules:/lib/modules:ro
      - /etc/ufw:/etc/ufw:rw

networks:
  internal_net:
    driver: bridge

volumes:
  redis_data:
    driver: local
