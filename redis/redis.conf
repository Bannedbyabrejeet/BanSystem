# =============================================================================
# Bannedbyabrejeet — Redis 7.2 Configuration (Production)
# Núcleo centralizado de persistencia y broker de eventos
# =============================================================================

# ------------------------------------------------------------------------------
# RED: Memoria y Limites
# ------------------------------------------------------------------------------
# Límite máximo de memoria. Cuando se alcanza, la política noeviction impide
# que clientes añadan nuevos datos (protege reglas de baneo).
maxmemory 256mb
maxmemory-policy noeviction

# ------------------------------------------------------------------------------
# NETWORK: Bind y Puerto
# ------------------------------------------------------------------------------
# Escuchar en todas las interfaces dentro del contenedor (Docker lo mapea).
bind 0.0.0.0
port 6379

# Timeout en segundos para conexiones idle (0 = desactivado).
timeout 300

# Keepalive TCP para detectar conexiones muertas.
tcp-keepalive 60

# ------------------------------------------------------------------------------
# GENERAL: Logs y Daemonización
# ------------------------------------------------------------------------------
# Nivel de log: debug | verbose | notice | warning
loglevel notice
logfile ""

# Nombre del PID file (no se usa en contenedores, pero se define por convención).
pidfile /tmp/redis.pid

# Number of databases (DB 0 se usa por defecto).
databases 1

# ------------------------------------------------------------------------------
# SNAPSHOTTING — RDB (Punto Fijo)
# Formato: save <segundos> <cambios>
# Se disparan snapshots cuando hay >= <cambios> escrituras en <segundos>.
save 900 1
save 300 10
save 60 10000

# Si el último snapshot falló, no continuar writes (modo seguro).
stop-writes-on-bgsave-error yes

# Compresión LZF para RDB.
rdbcompression yes
rdbchecksum yes

# Nombre del archivo RDB.
dbfilename dump.rdb

# Directorio de trabajo (relativo al volumen montado en /data).
dir /data

# ------------------------------------------------------------------------------
# APPEND-ONLY FILE — AOF (Persistencia de Comandos)
# ------------------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"

# fsync policy: everysec = equilibrio entre rendimiento y pérdida máxima 1s.
appendfsync everysec

# No rewrites AOF durante bgrewriteaof para evitar IOPS innecesarios.
no-appendfsync-on-rewrite no

# Umbral de crecimiento para auto-rewrite del AOF (porcentaje sobre último).
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Cargar AOF parcial tras crash si está truncada.
aof-load-truncated yes

# Formato AOF mixto (RDB inicial + comandos incrementales).
aof-use-rdb-preamble yes

# ------------------------------------------------------------------------------
# SECURITY: Autenticación
# La contraseña se inyecta vía variable de entorno en docker-compose.yml:
#   --requirepass ${REDIS_PASSWORD:-}
# --------------------------------------------------------------------------
