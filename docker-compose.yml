# BannedbyAbrejeet — Docker Compose
#
# Alcance: ÚNICAMENTE la base de datos Redis.
#
# El Servicio 1 (FastAPI) y el Frontend A (React) NO se dockerizan: se ejecutan
# en la máquina con `python -m uvicorn` y `npm run dev`. Solo Redis queda en un
# contenedor porque necesita un servidor real con persistencia en disco.
#
#   docker compose up -d redis     # única orden necesaria
#
# Redis queda accesible en 127.0.0.1:6379, que es el valor por defecto que usa
# el backend al correr localmente (ver REDIS_HOST en ../.env).

services:
  redis:
    image: redis:7.2-alpine
    container_name: bannedbyabrejeet_redis
    restart: unless-stopped
    # Exponer solo en loopback del host: el backend corre en la maquina.
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-}
    volumes:
      # Configuración personalizada de Redis
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      # Volumen nombrado persistente para AOF + RDB
      - redis_data:/data
    # Healthcheck nativo con redis-cli ping
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Límites de recursos para el contenedor
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  redis_data:
    driver: local